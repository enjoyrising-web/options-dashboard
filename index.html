<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期权投资看板</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap');
:root{
  --ink:#1a1a1a;--muted:#6b6b6b;--faint:#aaa;--border:#e8e6e0;
  --bg:#f5f5f2;--surface:#fff;
  --navy:#1a2a4a;--navy2:#253a63;
  --green:#1a7a4a;--green-bg:#edf7f1;
  --red:#c0392b;--red-bg:#fdf0ee;
  --amber:#92620a;--amber-bg:#fdf5e6;
  --blue:#185fa5;--blue-bg:#eef3fb;
  --purple:#7a2fa8;--purple-bg:#f5edfb;
  --teal:#1a6b7a;--teal-bg:#e8f5f7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.num{font-family:'IBM Plex Mono',monospace}
.green{color:var(--green)}.red{color:var(--red)}.muted{color:var(--muted)}.amber{color:var(--amber)}

/* Header */
.header{background:var(--navy);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header h1{font-size:18px;font-weight:600}
.header-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}
.fx-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;background:rgba(255,255,255,.07);border-radius:8px;padding:8px 14px;font-size:12px}
.fx-bar label{color:rgba(255,255,255,.6)}
.fx-bar input{width:72px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:3px 7px;color:#fff;font-size:12px;font-family:'IBM Plex Mono',monospace}
.fx-bar button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:5px;color:#fff;padding:4px 12px;cursor:pointer;font-size:12px}
.fx-bar button:hover{background:rgba(255,255,255,.25)}
.fx-updated{color:rgba(255,255,255,.4);font-size:11px;margin-left:auto}
.fetch-btn{font-size:11px;padding:1px 6px;border:1px solid rgba(255,255,255,.3);border-radius:4px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;margin-left:4px;vertical-align:middle}
.fetch-btn:hover{background:rgba(255,255,255,.25)}
.fetch-btn:disabled{opacity:.5;cursor:wait}

/* KPI */
.kpi-wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 20px}
.kpi{background:var(--surface);border-radius:10px;padding:12px 14px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.kpi-val{font-size:20px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.kpi-sub{font-size:11px;color:var(--faint);margin-top:2px}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 20px;background:var(--surface)}
.tab{font-size:13px;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);margin-bottom:-1px;transition:all .15s}
.tab.active{color:var(--ink);border-bottom-color:var(--navy);font-weight:500}
.tab:hover:not(.active){color:var(--ink)}
.panel{display:none}.panel.active{display:block}

/* Toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px}
.toolbar input,.toolbar select{font-size:12px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink)}
.toolbar input{width:170px}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 13px;border-radius:20px;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--muted);transition:all .1s}
.pill:hover{border-color:var(--navy);color:var(--navy)}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* Table */
.tbl-wrap{overflow-x:auto;padding:0 20px 20px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:900px}
th{text-align:left;padding:7px 8px;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
td{padding:7px 8px;border-bottom:1px solid #f5f5f2;vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
tr.clickable{cursor:pointer}
.tr{text-align:right;font-family:'IBM Plex Mono',monospace}

/* Badges */
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.bko{background:var(--green-bg);color:var(--green)}
.bact{background:var(--amber-bg);color:var(--amber)}
.bend{background:#f0f0ee;color:#888}
.bfwd{background:var(--purple-bg);color:var(--purple)}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg);color:var(--muted);font-family:'IBM Plex Mono',monospace}
.tag-r{background:var(--purple-bg);color:var(--purple)}

/* Progress */
.prog-wrap{display:flex;align-items:center;gap:5px}
.prog-bar{width:55px;height:4px;background:#eee;border-radius:3px;overflow:hidden;flex-shrink:0}
.prog-fill{height:100%;border-radius:3px;background:var(--green)}
.prog-fill.low{background:var(--red)}
.prog-lbl{font-size:10px;color:var(--muted)}

/* Closing price input */
.lc-input{width:80px;text-align:right;font-size:12px;font-family:'IBM Plex Mono',monospace;border:1px solid var(--border);border-radius:4px;padding:3px 5px;background:var(--bg);color:var(--ink);outline:none}
.lc-input:focus{border-color:var(--navy);background:#fff}
.lc-input.red{color:var(--red);border-color:#f5c6c2;background:var(--red-bg)}
.lc-input.green{color:var(--green);border-color:#b8e4cc;background:var(--green-bg)}
.lc-input::-webkit-inner-spin-button,.lc-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* Drawer */
.drawer-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200}
.drawer-bg.open{display:block}
.drawer{position:fixed;right:0;top:0;bottom:0;width:360px;background:var(--surface);box-shadow:-4px 0 24px rgba(0,0,0,.1);z-index:201;overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;padding:24px}
.drawer.open{transform:none}
.drawer-close{float:right;font-size:22px;cursor:pointer;color:var(--muted);background:none;border:none;line-height:1}
.drawer-title{font-size:18px;font-weight:600;margin-bottom:2px}
.drawer-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.drawer hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.dl-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #fafaf8;font-size:13px}
.dl-row:last-child{border-bottom:none}
.dl-label{color:var(--muted)}
.dl-val{font-weight:500;font-family:'IBM Plex Mono',monospace}
.profit-big{font-size:34px;font-weight:700;font-family:'IBM Plex Mono',monospace;margin:8px 0 4px}
.profit-orig{font-size:12px;color:var(--muted)}
.prog-lg{margin-top:12px}
.prog-lg-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.prog-lg-bar{height:7px;background:#f0eeea;border-radius:4px;overflow:hidden}
.prog-lg-fill{height:100%;border-radius:4px;background:var(--green)}
.prog-lg-fill.low{background:var(--red)}

/* Stats */
.stats-wrap{padding:14px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat-card{background:var(--surface);border-radius:10px;padding:16px 18px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.stat-card h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;font-weight:500}
.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.bar-name{width:80px;font-size:12px;color:var(--muted);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:7px;background:#f0eeea;border-radius:4px;overflow:hidden}
.bar-fill-pos{height:100%;border-radius:4px;background:var(--green)}
.bar-fill-neg{height:100%;border-radius:4px;background:var(--red)}
.bar-val{width:90px;font-size:11px;font-family:'IBM Plex Mono',monospace;text-align:right}
.rank-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid #fafaf8}
.rank-row:last-child{border-bottom:none}
.rank-no{width:20px;height:20px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);flex-shrink:0}
.rank-no.loss{background:var(--red-bg);color:var(--red)}
.rank-info{flex:1;min-width:0}
.rank-prod{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-under{font-size:11px;color:var(--muted)}
.rank-val{font-size:13px;font-weight:600;font-family:'IBM Plex Mono',monospace;white-space:nowrap}

/* FCN */
.fcn-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 8px}
.fcn-header h3{font-size:14px;font-weight:600}
.fcn-total{background:var(--teal-bg);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--teal)}
.fcn-total strong{font-size:20px;font-family:'IBM Plex Mono',monospace}

/* Inventory module */
.inv-header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 8px}
.inv-header h3{font-size:14px;font-weight:600}
.inv-ticker-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 12px;overflow-x:auto}
.inv-ticker-btn{font-size:11px;padding:4px 12px;border-radius:20px;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.inv-ticker-btn.active{background:var(--navy);border-color:var(--navy);color:#fff}
.inv-ticker-btn:hover:not(.active){border-color:var(--navy);color:var(--navy)}
.inv-summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 20px 14px}
.inv-stat{background:var(--surface);border-radius:8px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.inv-stat-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.inv-stat-val{font-size:16px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.lot-type-batch{background:var(--teal-bg);color:var(--teal);font-size:10px;padding:1px 6px;border-radius:4px}
.lot-type-fifo{background:var(--blue-bg);color:var(--blue);font-size:10px;padding:1px 6px;border-radius:4px}
.pnl-positive{color:var(--green);font-weight:600}
.pnl-negative{color:var(--red);font-weight:600}

/* Cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:14px 20px}
.card{background:var(--surface);border-radius:10px;padding:13px 14px;box-shadow:0 1px 6px rgba(0,0,0,.05);cursor:pointer;transition:box-shadow .1s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.card-title{font-size:13px;font-weight:600}
.card-under{font-size:11px;color:var(--muted);margin-top:1px}
.card-pnl{font-size:19px;font-weight:700;font-family:'IBM Plex Mono',monospace;margin:5px 0}
.card-meta{font-size:11px;color:var(--muted);line-height:1.6}
.card-prog{margin-top:9px}
.cp-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:3px}

.empty{text-align:center;padding:2.5rem;color:var(--muted);font-size:13px}
@media(max-width:768px){.kpi-wrap{grid-template-columns:repeat(2,1fr)}.stats-wrap{grid-template-columns:1fr}.drawer{width:100%}.inv-summary-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>期权投资看板</h1>
      <div class="header-sub" id="updated-at">数据加载中...</div>
    </div>
  </div>
  <div class="fx-bar">
    <label>USD/HKD</label><input id="fx-usd" type="number" step="0.001" value="7.8277">
    <label>JPY/HKD</label><input id="fx-jpy" type="number" step="0.0001" value="0.049">
    <button onclick="applyFX()">更新汇率</button>
    <span class="fx-updated" id="fx-updated">—</span>
  </div>
</div>

<div class="kpi-wrap" id="kpis"></div>

<div class="tabs">
  <div class="tab active" data-tab="overview" onclick="switchTab(this)">产品总览</div>
  <div class="tab" data-tab="active"    onclick="switchTab(this)">存续订单</div>
  <div class="tab" data-tab="inventory" onclick="switchTab(this)">库存明细</div>
  <div class="tab" data-tab="stats"     onclick="switchTab(this)">统计分析</div>
  <div class="tab" data-tab="fcn"       onclick="switchTab(this)">FCN台账</div>
</div>

<!-- Overview -->
<div class="panel active" id="panel-overview">
  <div class="toolbar">
    <input type="text" id="search" placeholder="搜索标的 / 产品..." oninput="renderAll()">
    <select id="ccy-sel" onchange="renderAll()">
      <option value="">全部币种</option>
      <option value="HKD">HKD</option><option value="USD">USD</option><option value="JPY">JPY</option>
    </select>
    <div class="pills" id="filter-pills">
      <span class="pill on" data-f="all"     onclick="setPill(this)">全部</span>
      <span class="pill"    data-f="存续中"   onclick="setPill(this)">存续中</span>
      <span class="pill"    data-f="敲出"    onclick="setPill(this)">已敲出</span>
      <span class="pill"    data-f="累计期权"  onclick="setPill(this)">累计</span>
      <span class="pill"    data-f="反累计期权" onclick="setPill(this)">反累计</span>
    </div>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th onclick="sort('underlying')">标的 ↕</th>
        <th onclick="sort('product')">产品编号 ↕</th>
        <th>类型</th>
        <th onclick="sort('obs')">下单日期 ↕</th>
        <th>状态</th>
        <th class="tr">昨日收盘 <button class="fetch-btn" onclick="fetchAllPrices(event)" title="自动查询收盘价">↻</button></th>
        <th class="tr" onclick="sort('strike')">成交价 ↕</th>
        <th class="tr" onclick="sort('knockout')">敲出价 ↕</th>
        <th class="tr" onclick="sort('knockin')">敲入价 ↕</th>
        <th class="tr" onclick="sort('daily')">每天股数 ↕</th>
        <th class="tr" onclick="sort('uns')">未接股数 ↕</th>
        <th class="tr" onclick="sort('inventory')">库存 ↕</th>
        <th class="tr" onclick="sort('floatPnl')">浮动盈亏 ↕</th>
        <th class="tr" onclick="sort('profitHKD')">总盈利 HKD ↕</th>
        <th>进度</th>
      </tr></thead>
      <tbody id="ov-body"></tbody>
    </table>
  </div>
</div>

<!-- Active -->
<div class="panel" id="panel-active">
  <div id="active-cards" class="card-grid"></div>
</div>

<!-- Inventory -->
<div class="panel" id="panel-inventory">
  <div class="inv-header">
    <h3>库存明细</h3>
    <div style="font-size:12px;color:var(--muted)">批次计价（接股）· FIFO（市场买入）</div>
  </div>
  <div class="inv-ticker-tabs" id="inv-tickers"></div>
  <div class="inv-summary-row" id="inv-summary"></div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>日期</th><th>类型</th><th>计价方式</th>
        <th class="tr">数量</th><th class="tr">成本价</th><th class="tr">成本金额</th>
        <th class="tr">昨日收盘</th><th class="tr">市值</th><th class="tr">浮动盈亏</th>
        <th>备注</th>
      </tr></thead>
      <tbody id="inv-body"></tbody>
    </table>
  </div>
</div>

<!-- Stats -->
<div class="panel" id="panel-stats">
  <div class="stats-wrap" id="stats-content"></div>
</div>

<!-- FCN -->
<div class="panel" id="panel-fcn">
  <div class="fcn-header">
    <h3>FCN 台账</h3>
    <div class="fcn-total">合计已收息：<strong id="fcn-total-val">—</strong> HKD</div>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>下单日</th><th>标的</th><th>金额</th><th>币种</th><th>期限</th>
        <th>交割日</th><th>比价日</th><th>到期日</th>
        <th class="tr">行使价%</th><th class="tr">行使价</th>
        <th class="tr">票息%pa</th><th>频率</th>
        <th class="tr">敲出%</th><th>已收息(HKD)</th><th>收息日期</th>
      </tr></thead>
      <tbody id="fcn-body"></tbody>
    </table>
  </div>
</div>

<!-- Drawer -->
<div class="drawer-bg" id="drawer-bg" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"><button class="drawer-close" onclick="closeDrawer()">×</button><div id="drawer-body"></div></div>

<script>
// ── State ────────────────────────────────────────────────────
let DATA=[], TXN=[], INV={}, FCN_DATA={rows:[],totalInterest:0};
let fxUSD=7.8277, fxJPY=0.049;
let filterStatus='all', sortCol='underlying', sortAsc=true;
let lastClose = JSON.parse(localStorage.getItem('lastClose')||'{}');
let activeTicker = null;

// ── Load data ─────────────────────────────────────────────────
async function loadData(){
  try{
    const [pRes, tRes] = await Promise.all([
      fetch('./data/products.json?v='+Date.now()),
      fetch('./data/transactions.json?v='+Date.now()).catch(()=>null)
    ]);
    const pJson = await pRes.json();
    DATA = pJson.products || [];
    FCN_DATA = pJson.fcn || {rows:[],totalInterest:0};
    INV  = pJson.inventory || {};
    if(pJson.fx){ fxUSD=pJson.fx.USDHKD||7.8277; fxJPY=pJson.fx.JPYHKD||0.049; }
    document.getElementById('fx-usd').value=fxUSD;
    document.getElementById('fx-jpy').value=fxJPY;
    // Merge stored close prices
    DATA.forEach(p=>{
      if(lastClose[p.product]) p._storedClose=parseFloat(lastClose[p.product]);
      p.close = p._storedClose || p.close || null;
    });
    if(tRes){ const tj=await tRes.json(); TXN=tj||[]; }
    document.getElementById('updated-at').textContent='数据截至 '+(pJson.updatedAt||'')+'  · 点击行查看详情';
    renderAll();
  }catch(e){
    document.getElementById('kpis').innerHTML='<div class="kpi"><div class="kpi-label">加载失败</div><div class="kpi-val red">ERR</div></div>';
    console.error(e);
  }
}

// ── Utils ─────────────────────────────────────────────────────
const fmt=(n,d=0)=>n==null?'—':Number(n).toLocaleString('zh',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtBig=n=>{if(n==null)return'—';const a=Math.abs(n),s=n<0?'-':'';return a>=1e8?s+(a/1e8).toFixed(2)+'亿':a>=1e4?s+(a/1e4).toFixed(1)+'万':s+fmt(a)};
const prog=p=>p.maxShares>0?Math.round((1-(p.uns||0)/p.maxShares)*100):null;
const bclass=s=>s==='敲出'?'bko':s==='存续中'?'bact':s==='结束'?'bend':'bfwd';
const toHKD=p=>{if(p.profitHKD==null)return null;return p.profitHKD};

// Float PnL: (close - avg_cost) * inventory_qty
function getFloatPnl(p){
  const close = p.close;
  if(!close||!p.inventory||p.inventory===0)return null;
  // Find matching inventory
  const ticker = Object.keys(INV).find(k=>k.toLowerCase().includes(p.underlying.toLowerCase().slice(0,4))||
    (p.product.includes(k))||(k.includes(p.product.split('(')[0].replace(/\s/g,''))));
  if(!ticker||!INV[ticker])return null;
  const inv=INV[ticker];
  if(!inv.qty||inv.qty===0)return null;
  const avgCost=inv.lots.reduce((s,l)=>s+l.price*l.qty,0)/inv.qty;
  const floatPnl=(close-avgCost)*inv.qty;
  // Convert to HKD if needed
  if(p.ccy==='USD')return floatPnl*fxUSD;
  if(p.ccy==='JPY')return floatPnl*fxJPY;
  return floatPnl;
}

// ── FX ────────────────────────────────────────────────────────
function applyFX(){
  fxUSD=parseFloat(document.getElementById('fx-usd').value)||7.8277;
  fxJPY=parseFloat(document.getElementById('fx-jpy').value)||0.049;
  const now=new Date().toLocaleDateString('zh',{month:'short',day:'numeric'});
  document.getElementById('fx-updated').textContent='汇率更新：'+now;
  renderAll();
}

// ── Price fetch ───────────────────────────────────────────────
async function fetchPrice(ticker){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=5d`;
  const proxies=[`https://corsproxy.io/?${encodeURIComponent(url)}`,`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`];
  for(const p of proxies){
    try{
      const r=await fetch(p,{signal:AbortSignal.timeout(10000)});
      if(!r.ok)continue;
      const j=await r.json();
      const closes=j?.chart?.result?.[0]?.indicators?.quote?.[0]?.close;
      if(closes){const c=closes.filter(v=>v!=null).slice(-1)[0];if(c)return Math.round(c*10000)/10000;}
    }catch(e){continue;}
  }
  return null;
}

async function fetchAllPrices(evt){
  evt.stopPropagation();
  const btn=evt.target; btn.textContent='⏳'; btn.disabled=true;
  const active=DATA.filter(p=>p.status==='存续中'&&p.ticker);
  const tickers=[...new Set(active.map(p=>p.ticker))];
  let fetched=0;
  for(const ticker of tickers){
    const price=await fetchPrice(ticker);
    if(price){
      DATA.filter(p=>p.ticker===ticker).forEach(p=>{
        p.close=price; lastClose[p.product]=price;
      });
      fetched++;
    }
    await new Promise(r=>setTimeout(r,350));
  }
  localStorage.setItem('lastClose',JSON.stringify(lastClose));
  renderAll();
  btn.textContent='↻'; btn.disabled=false;
  const now=new Date().toLocaleString('zh',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('fx-updated').textContent=`收盘更新：${now}（${fetched}/${tickers.length}只）`;
}

function setLastClose(product, val, el){
  const v=parseFloat(val);
  lastClose[product]=v;
  localStorage.setItem('lastClose',JSON.stringify(lastClose));
  const p=DATA.find(d=>d.product===product);
  if(p){p.close=v;}
  // color
  if(p&&v){
    el.className='lc-input '+(p.knockin&&v<p.knockin?'red':p.knockout&&v>p.knockout?'green':'');
  }
  renderAll();
}

// ── KPIs ──────────────────────────────────────────────────────
function renderKPIs(){
  const total=DATA.reduce((s,p)=>s+(toHKD(p)||0),0);
  const active=DATA.filter(p=>p.status==='存续中');
  const ko=DATA.filter(p=>p.status==='敲出');
  const uns=active.reduce((s,p)=>s+(p.uns||0),0);
  // Total float PnL
  let totalFloat=0;
  Object.values(INV).forEach(inv=>{
    if(!inv.qty)return;
    // find close price from product
    const ticker=Object.keys(INV).find(k=>INV[k]===inv);
    const p=DATA.find(d=>d.ticker&&d.ticker.toLowerCase().includes(ticker.toLowerCase().slice(0,4)));
    if(p&&p.close){
      const avgCost=inv.lots.reduce((s,l)=>s+l.price*l.qty,0)/inv.qty;
      let fp=(p.close-avgCost)*inv.qty;
      if(p.ccy==='USD')fp*=fxUSD;
      if(p.ccy==='JPY')fp*=fxJPY;
      totalFloat+=fp;
    }
  });
  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><div class="kpi-label">累计总利润</div>
      <div class="kpi-val ${total>=0?'green':'red'}">${total>=0?'+':''}${fmtBig(total)} HKD</div>
      <div class="kpi-sub">已实现 + 浮盈合计</div></div>
    <div class="kpi"><div class="kpi-label">产品总数</div>
      <div class="kpi-val">${DATA.length}</div>
      <div class="kpi-sub">存续 ${active.length} · 敲出 ${ko.length}</div></div>
    <div class="kpi"><div class="kpi-label">存续订单</div>
      <div class="kpi-val muted">${active.length}</div>
      <div class="kpi-sub">含反累计 ${active.filter(p=>p.type==='反累计期权').length} 个</div></div>
    <div class="kpi"><div class="kpi-label">总未接股数</div>
      <div class="kpi-val muted">${fmt(uns)}</div>
      <div class="kpi-sub">存续订单合计</div></div>
    <div class="kpi"><div class="kpi-label">FCN已收息</div>
      <div class="kpi-val teal">${fmtBig(FCN_DATA.totalInterest)} HKD</div>
      <div class="kpi-sub">${FCN_DATA.rows.length} 笔FCN合计</div></div>
  `;
}

// ── Filter / Sort ─────────────────────────────────────────────
function filtered(){
  let d=[...DATA];
  const q=(document.getElementById('search')?.value||'').toLowerCase();
  const ccy=document.getElementById('ccy-sel')?.value||'';
  if(q) d=d.filter(p=>p.underlying.includes(q)||p.product.toLowerCase().includes(q));
  if(ccy) d=d.filter(p=>p.ccy===ccy);
  if(filterStatus==='存续中') d=d.filter(p=>p.status==='存续中');
  else if(filterStatus==='敲出') d=d.filter(p=>p.status==='敲出');
  else if(filterStatus==='累计期权') d=d.filter(p=>p.type==='累计期权');
  else if(filterStatus==='反累计期权') d=d.filter(p=>p.type==='反累计期权');
  d.sort((a,b)=>{
    let va=a[sortCol]??'', vb=b[sortCol]??'';
    if(typeof va==='number'&&typeof vb==='number') return sortAsc?va-vb:vb-va;
    return sortAsc?String(va).localeCompare(String(vb),undefined,{numeric:true}):String(vb).localeCompare(String(va),undefined,{numeric:true});
  });
  return d;
}

function setPill(el){
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));
  el.classList.add('on'); filterStatus=el.dataset.f; renderAll();
}
function sort(col){
  if(sortCol===col)sortAsc=!sortAsc; else{sortCol=col;sortAsc=true;} renderAll();
}

// ── Overview table ────────────────────────────────────────────
function renderOverview(){
  const d=filtered();
  if(!d.length){document.getElementById('ov-body').innerHTML=`<tr><td colspan="15" class="empty">暂无数据</td></tr>`;return;}
  // Track inventory display per underlying (show only once)
  const shownInv={};
  document.getElementById('ov-body').innerHTML=d.map(p=>{
    const idx=DATA.indexOf(p);
    const pnl=toHKD(p);
    const pStr=pnl!=null?`<span class="${pnl>=0?'green':'red'}">${pnl>=0?'+':''}${fmt(pnl)}</span>`:`<span class="muted">—</span>`;
    const pc=prog(p);
    const bar=pc!=null?`<div class="prog-wrap"><div class="prog-bar"><div class="prog-fill ${pc<30?'low':''}" style="width:${pc}%"></div></div><span class="prog-lbl">${pc}%</span></div>`:'-';
    const typeTag=p.type==='反累计期权'?`<span class="tag tag-r">反累计</span>`:`<span class="tag">累计</span>`;
    const lc=p.close||'';
    const lcColor=lc&&p.knockin&&parseFloat(lc)<p.knockin?'red':lc&&p.knockout&&parseFloat(lc)>p.knockout?'green':'';
    // Inventory: show once per underlying
    let invStr='—';
    if(!shownInv[p.underlying]&&p.inventory&&p.inventory>0){
      invStr=fmt(p.inventory); shownInv[p.underlying]=true;
    }
    // Float PnL
    const fp=getFloatPnl(p);
    const fpStr=fp!=null?`<span class="${fp>=0?'green':'red'}">${fp>=0?'+':''}${fmt(fp,0)}</span>`:'—';
    const unsStr=p.uns>0?fmt(p.uns):(p.uns===0&&p.status==='敲出'?'<span class="muted">清零</span>':'—');
    return `<tr class="clickable" onclick="openDrawer(${idx})">
      <td>${p.underlying}</td>
      <td><strong>${p.product}</strong></td>
      <td>${typeTag}</td>
      <td style="color:var(--muted)">${p.obs||'—'}</td>
      <td><span class="badge ${bclass(p.status)}">${p.status}</span></td>
      <td class="tr"><input class="lc-input ${lcColor}" type="number" step="any" data-prod="${p.product}"
        value="${lc}" placeholder="—" onclick="event.stopPropagation()"
        onchange="setLastClose(this.dataset.prod,this.value,this)"></td>
      <td class="tr">${p.strike?fmt(p.strike,4):'—'}</td>
      <td class="tr">${p.knockout?fmt(p.knockout,4):'—'}</td>
      <td class="tr">${p.knockin?fmt(p.knockin,4):'—'}</td>
      <td class="tr">${p.daily?fmt(p.daily):'—'}</td>
      <td class="tr">${unsStr}</td>
      <td class="tr">${invStr}</td>
      <td class="tr">${fpStr}</td>
      <td class="tr">${pStr}</td>
      <td>${bar}</td>
    </tr>`;
  }).join('');
}

// ── Active cards ──────────────────────────────────────────────

  const active=DATA.filter(p=>p.status==='存续中');
  document.getElementById('active-cards').innerHTML=active.map(p=>{
    const idx=DATA.indexOf(p); const pnl=toHKD(p); const pc=prog(p);
    const fp=getFloatPnl(p);
    return `<div class="card" onclick="openDrawer(${idx})">
      <div class="card-top"><div><div class="card-title">${p.product}</div><div class="card-under">${p.underlying}</div></div><span class="badge ${bclass(p.status)}">${p.status}</span></div>
      <div class="card-pnl ${pnl==null?'muted':pnl>=0?'green':'red'}">${pnl!=null?(pnl>=0?'+':'')+fmt(pnl):'待结算'}</div>
      ${fp!=null?`<div style="font-size:12px;color:${fp>=0?'var(--green)':'var(--red)'};margin-bottom:4px">浮动：${fp>=0?'+':''}${fmt(fp,0)}</div>`:''}
      <div class="card-meta">${p.obs}<br>${p.knockin?`敲入 ${fmt(p.knockin,4)}<br>`:''}${p.uns!=null?`未接 ${fmt(p.uns)}<br>`:''}${p.daily?`每天 ${fmt(p.daily)} 股`:''}</div>
      ${pc!=null?`<div class="card-prog"><div class="cp-label"><span>接股进度</span><span>${pc}%</span></div><div class="prog-bar" style="width:100%;height:4px"><div class="prog-fill ${pc<30?'low':''}" style="width:${pc}%"></div></div></div>`:''}
    </div>`;
  }).join('')||'<div class="empty">暂无存续订单</div>';
}

// ── Inventory module ──────────────────────────────────────────
function renderInventory(ticker){
  const tickers=Object.keys(INV).filter(t=>INV[t].qty>0||INV[t].lots.length>0);
  activeTicker=ticker||tickers[0]||null;

  // Ticker tabs
  document.getElementById('inv-tickers').innerHTML=tickers.map(t=>`
    <button class="inv-ticker-btn ${t===activeTicker?'active':''}" onclick="renderInventory('${t}')">${t}</button>
  `).join('');

  if(!activeTicker||!INV[activeTicker]){
    document.getElementById('inv-summary').innerHTML='';
    document.getElementById('inv-body').innerHTML='<tr><td colspan="10" class="empty">暂无库存数据</td></tr>';
    return;
  }
  const inv=INV[activeTicker];
  const lots=inv.lots||[];

  // Find close price
  const p=DATA.find(d=>d.ticker&&(d.ticker.toLowerCase()===activeTicker.toLowerCase()||
    d.product.replace(/[^a-zA-Z0-9]/g,'').toLowerCase().includes(activeTicker.replace(/[^a-zA-Z0-9]/g,'').toLowerCase())));
  const close=p?.close||null;
  const ccy=p?.ccy||'HKD';

  // Summary stats
  const totalQty=lots.reduce((s,l)=>s+l.qty,0);
  const totalCost=lots.reduce((s,l)=>s+l.price*l.qty,0);
  const avgCost=totalQty>0?totalCost/totalQty:0;
  const marketVal=close?close*totalQty:null;
  const floatPnl=close?(close-avgCost)*totalQty:null;
  const fxRate=ccy==='USD'?fxUSD:ccy==='JPY'?fxJPY:1;

  document.getElementById('inv-summary').innerHTML=`
    <div class="inv-stat"><div class="inv-stat-label">总持仓</div><div class="inv-stat-val">${fmt(totalQty)}</div></div>
    <div class="inv-stat"><div class="inv-stat-label">平均成本</div><div class="inv-stat-val">${fmt(avgCost,4)}</div></div>
    <div class="inv-stat"><div class="inv-stat-label">市值(${ccy})</div><div class="inv-stat-val">${marketVal?fmt(marketVal,0):'—'}</div></div>
    <div class="inv-stat"><div class="inv-stat-label">浮动盈亏(HKD)</div>
      <div class="inv-stat-val ${floatPnl==null?'muted':floatPnl>=0?'pnl-positive':'pnl-negative'}">${floatPnl!=null?(floatPnl>=0?'+':'')+fmt(floatPnl*fxRate,0):'—'}</div></div>
  `;

  // Lot rows
  document.getElementById('inv-body').innerHTML=lots.map(lot=>{
    const lotClose=close||null;
    const lotMv=lotClose?lotClose*lot.qty:null;
    const lotPnl=lotClose?(lotClose-lot.price)*lot.qty:null;
    const lotPnlHKD=lotPnl?lotPnl*fxRate:null;
    return `<tr>
      <td>${lot.date}</td>
      <td>${lot.txType}</td>
      <td><span class="${lot.type==='batch'?'lot-type-batch':'lot-type-fifo'}">${lot.type==='batch'?'批次计价':'FIFO'}</span></td>
      <td class="tr">${fmt(lot.qty)}</td>
      <td class="tr">${fmt(lot.price,4)}</td>
      <td class="tr">${fmt(lot.price*lot.qty,2)}</td>
      <td class="tr">${lotClose?fmt(lotClose,4):'—'}</td>
      <td class="tr">${lotMv?fmt(lotMv,2):'—'}</td>
      <td class="tr">${lotPnlHKD!=null?`<span class="${lotPnlHKD>=0?'pnl-positive':'pnl-negative'}">${lotPnlHKD>=0?'+':''}${fmt(lotPnlHKD,0)}</span>`:'—'}</td>
      <td></td>
    </tr>`;
  }).join('')||'<tr><td colspan="10" class="empty">无持仓记录</td></tr>';
}

// ── Stats ─────────────────────────────────────────────────────
function renderStats(){
  const byU={};
  DATA.forEach(p=>{byU[p.underlying]=(byU[p.underlying]||0)+(toHKD(p)||0);});
  const uList=Object.entries(byU).sort((a,b)=>b[1]-a[1]);
  const maxAbs=Math.max(...uList.map(([,v])=>Math.abs(v)),1);
  const topWin=[...DATA].filter(p=>p.profitHKD>0).sort((a,b)=>b.profitHKD-a.profitHKD).slice(0,5);
  const topLoss=[...DATA].filter(p=>p.profitHKD<0).sort((a,b)=>a.profitHKD-b.profitHKD).slice(0,5);
  document.getElementById('stats-content').innerHTML=`
    <div class="stat-card" style="grid-column:1/-1"><h3>按标的盈亏汇总（HKD）</h3>
      ${uList.map(([name,v])=>`<div class="bar-row">
        <span class="bar-name" title="${name}">${name}</span>
        <div class="bar-track"><div class="${v>=0?'bar-fill-pos':'bar-fill-neg'}" style="width:${Math.round(Math.abs(v)/maxAbs*100)}%"></div></div>
        <span class="bar-val ${v>=0?'green':'red'}">${(v>=0?'+':'')+fmtBig(v)}</span>
      </div>`).join('')}
    </div>
    <div class="stat-card"><h3>盈利 Top 5</h3>
      ${topWin.map((p,i)=>`<div class="rank-row"><div class="rank-no">${i+1}</div><div class="rank-info"><div class="rank-prod">${p.product}</div><div class="rank-under">${p.underlying}</div></div><span class="rank-val green">+${fmt(p.profitHKD)}</span></div>`).join('')||'<div class="empty">—</div>'}
    </div>
    <div class="stat-card"><h3>亏损 Top 5</h3>
      ${topLoss.map((p,i)=>`<div class="rank-row"><div class="rank-no loss">${i+1}</div><div class="rank-info"><div class="rank-prod">${p.product}</div><div class="rank-under">${p.underlying}</div></div><span class="rank-val red">${fmt(p.profitHKD)}</span></div>`).join('')||'<div class="empty">暂无亏损</div>'}
    </div>`;
}

// ── Drawer ─────────────────────────────────────────────────────
function openDrawer(idx){
  const p=DATA[idx]; if(!p)return;
  const pnl=toHKD(p); const pc=prog(p); const fp=getFloatPnl(p);
  const origPnl=pnl&&p.ccy!=='HKD'?(p.ccy==='USD'?pnl/fxUSD:pnl/fxJPY):null;
  document.getElementById('drawer-body').innerHTML=`
    <div class="drawer-title">${p.product}</div>
    <div class="drawer-sub">${p.underlying} · ${p.type}</div>
    <hr>
    ${[[' 状态','badge'],['下单日期',p.obs||'—'],['成交价',p.strike?fmt(p.strike,4):'—'],['敲入价',p.knockin?fmt(p.knockin,4):'—'],
       ['敲出价',p.knockout?fmt(p.knockout,4):'—'],['折扣率',p.discount?(p.discount*100).toFixed(2)+'%':'—'],
       ['每天接股',p.daily?fmt(p.daily)+' 股':'—'],['最多接股',p.maxShares?fmt(p.maxShares):'—'],
       ['未接股数',p.uns!=null?fmt(p.uns):'—'],['库存数量',p.inventory?fmt(p.inventory):'—'],
       ['昨日收盘',p.close?fmt(p.close,4):'—'],['币种',p.ccy]
    ].map(([l,v])=>l===' 状态'?
      `<div class="dl-row"><span class="dl-label">状态</span><span class="badge ${bclass(p.status)}">${p.status}</span></div>`:
      `<div class="dl-row"><span class="dl-label">${l}</span><span class="dl-val">${v}</span></div>`).join('')}
    <hr>
    <div style="font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em">已实现总盈利</div>
    <div class="profit-big ${pnl==null?'muted':pnl>=0?'green':'red'}">${pnl!=null?(pnl>=0?'+':'')+fmt(pnl):'待结算'}</div>
    ${pnl!=null?`<span style="font-size:12px;color:var(--muted)">HKD</span>`:''}
    ${origPnl!=null?`<div class="profit-orig">原币：${fmt(origPnl,0)} ${p.ccy}</div>`:''}
    ${fp!=null?`<div style="margin-top:8px;font-size:13px"><span style="color:var(--muted)">浮动盈亏：</span><span style="font-weight:600;color:${fp>=0?'var(--green)':'var(--red)'}">${fp>=0?'+':''}${fmt(fp,0)} HKD</span></div>`:''}
    ${pc!=null?`<div class="prog-lg"><div class="prog-lg-label"><span>接股进度</span><span>${pc}%</span></div><div class="prog-lg-bar"><div class="prog-lg-fill ${pc<30?'low':''}" style="width:${pc}%"></div></div></div>`:''}
  `;
  document.getElementById('drawer-bg').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){document.getElementById('drawer-bg').classList.remove('open');document.getElementById('drawer').classList.remove('open');}

// ── Tabs ───────────────────────────────────────────────────────
function switchTab(el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-'+el.dataset.tab).classList.add('active');
  if(el.dataset.tab==='inventory') renderInventory(activeTicker);
}

// ── Render all ─────────────────────────────────────────────────
function renderAll(){
  renderKPIs(); renderOverview(); renderActive(); renderStats(); renderFCN();
}

loadData();
