name: Snapshot products.json

on:
  workflow_dispatch:        # 手动:Actions 页面点 "Run workflow" 即可
  schedule:
    - cron: '30 20 1 * *'   # 兜底:每月1号 20:30 UTC 自动存一份

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save dated snapshot
        run: |
          mkdir -p data/snapshots
          STAMP=$(date -u +%Y-%m-%d)
          cp data/products.json "data/snapshots/products_${STAMP}.json"
          git config user.name "actions-user"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots/
          git commit -m "Snapshot products.json ${STAMP}" || echo "no changes to snapshot"
          git push
