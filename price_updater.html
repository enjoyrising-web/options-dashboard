<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>看板更新工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:#f5f5f7;color:#1a1a1a;font-size:16px}
.header{background:#1a2a4a;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10}
.header h1{font-size:18px;font-weight:600}
.header-sub{font-size:12px;color:rgba(255,255,255,0.6);margin-top:2px}
.token-bar{background:#fff;padding:12px 16px;border-bottom:1px solid #e8e6e0;display:flex;gap:8px;align-items:center}
.token-bar input{flex:1;font-size:13px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-family:monospace}
.token-bar button{font-size:13px;padding:8px 14px;border-radius:8px;border:none;background:#1a2a4a;color:#fff;white-space:nowrap}
.status-bar{padding:10px 16px;font-size:13px;text-align:center;display:none}
.status-bar.show{display:block}
.status-bar.ok{background:#edf7f1;color:#1a7a4a}
.status-bar.err{background:#fdf0ee;color:#c0392b}
.status-bar.loading{background:#fdf5e6;color:#92620a}

/* Tabs */
.tabs{display:flex;background:#fff;border-bottom:2px solid #e8e6e0;overflow-x:auto}
.tab-btn{flex:1;padding:12px 8px;font-size:14px;border:none;background:none;color:#999;cursor:pointer;white-space:nowrap;min-width:70px}
.tab-btn.active{color:#1a2a4a;border-bottom:2px solid #1a2a4a;margin-bottom:-2px;font-weight:600}
.tab-panel{display:none;padding:16px}
.tab-panel.active{display:block}

/* Form */
.section{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:14px}
.section-title{padding:12px 16px;font-size:12px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #f5f5f5;background:#fafaf8}
.form-row{padding:12px 16px;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;gap:12px}
.form-row:last-child{border-bottom:none}
.form-label{font-size:14px;color:#333;width:90px;flex-shrink:0}
.form-row input,.form-row select{flex:1;font-size:15px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;background:#fff}
.form-row input:focus,.form-row select:focus{border-color:#1a2a4a;outline:none}
.form-row.highlight input,.form-row.highlight select{border-color:#1a7a4a;background:#edf7f1}

/* Price rows */
.price-row{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid #f5f5f5;gap:12px}
.price-row:last-child{border-bottom:none}
.price-label{flex:1}
.price-name{font-size:15px;font-weight:500}
.price-ticker{font-size:12px;color:#999;margin-top:1px}
.price-input{width:110px;font-size:16px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;text-align:right;font-family:monospace}
.price-input:focus{border-color:#1a2a4a;outline:none}
.price-input.changed{border-color:#1a7a4a;background:#edf7f1}

/* Buttons */
.btn-primary{display:block;width:100%;padding:15px;font-size:17px;font-weight:600;background:#1a2a4a;color:#fff;border:none;border-radius:12px;cursor:pointer;margin-top:4px}
.btn-primary:active{background:#253a63}
.btn-primary:disabled{background:#aaa;cursor:wait}
.btn-secondary{display:block;width:100%;padding:12px;font-size:15px;background:#fff;color:#1a2a4a;border:1.5px solid #1a2a4a;border-radius:12px;cursor:pointer;margin-bottom:10px}
.btn-danger{background:#fff;color:#c0392b;border:1.5px solid #c0392b}

/* Product list */
.prod-item{padding:12px 16px;border-bottom:1px solid #f5f5f5;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.prod-item:last-child{border-bottom:none}
.prod-item:active{background:#f5f5f5}
.prod-name{font-size:15px;font-weight:500}
.prod-meta{font-size:12px;color:#999;margin-top:2px}
.prod-status{font-size:12px;padding:2px 8px;border-radius:10px}
.s-active{background:#fdf5e6;color:#92620a}
.s-ko{background:#edf7f1;color:#1a7a4a}

.badge-tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;background:#eef3fb;color:#185fa5;margin-left:6px}
.note{font-size:12px;color:#999;padding:10px 16px;text-align:center}
.divider{height:1px;background:#f0eeea;margin:4px 0}
</style>
</head>
<body>

<div class="header">
  <h1>📊 看板更新工具</h1>
  <div class="header-sub" id="last-sync">尚未同步</div>
</div>

<div class="token-bar">
  <input type="password" id="token-input" placeholder="GitHub Token" autocomplete="off">
  <button onclick="saveToken()">保存</button>
</div>

<div class="status-bar" id="status-bar"></div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('prices',this)">收盘价</button>
  <button class="tab-btn" onclick="switchTab('trade',this)">交易录入</button>
  <button class="tab-btn" onclick="switchTab('knockout',this)">敲出</button>
</div>

<!-- ── Tab 1: 收盘价 ── -->
<div class="tab-panel active" id="tab-prices">
  <button class="btn-secondary" onclick="loadPrices()">⬇ 读取当前数据</button>

  <div class="section">
    <div class="section-title">港股 HKD</div>
    <div id="rows-hk"></div>
  </div>
  <div class="section">
    <div class="section-title">美股 USD</div>
    <div id="rows-us"></div>
  </div>
  <div class="section">
    <div class="section-title">日股 JPY</div>
    <div id="rows-jp"></div>
  </div>
  <button class="btn-primary" id="btn-price-update" onclick="pushPrices()">⬆ 更新收盘价到看板</button>
  <div class="note" id="last-updated">所有人看到的收盘价将同步更新</div>
</div>

<!-- ── Tab 2: 交易录入 ── -->
<div class="tab-panel" id="tab-trade">
  <button class="btn-secondary" onclick="loadPrices()">⬇ 先读取当前数据</button>

  <div class="section">
    <div class="section-title">交易类型</div>
    <div class="form-row">
      <label class="form-label">类型</label>
      <select id="trade-type" onchange="onTradeTypeChange()">
        <option value="接股">接股（期权行权交割）</option>
        <option value="买入">市场买入</option>
        <option value="卖出">市场卖出</option>
        <option value="行权卖出">行权卖出（反累计）</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title">标的信息</div>
    <div class="form-row">
      <label class="form-label">标的代码</label>
      <select id="trade-ticker">
        <option value="">-- 选择标的 --</option>
      </select>
    </div>
    <div class="form-row" id="row-order" style="display:none">
      <label class="form-label">对应订单</label>
      <select id="trade-order">
        <option value="">-- 选择订单 --</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title">交易详情</div>
    <div class="form-row">
      <label class="form-label">日期</label>
      <input type="date" id="trade-date">
    </div>
    <div class="form-row">
      <label class="form-label">数量（股）</label>
      <input type="number" id="trade-qty" placeholder="例：380">
    </div>
    <div class="form-row">
      <label class="form-label">单价</label>
      <input type="number" id="trade-price" step="any" placeholder="例：75.5478"
        >
    </div>
    <div class="form-row">
      <label class="form-label">总价</label>
      <input type="number" id="trade-amount" step="any" placeholder="手动填入（含税费）"
        >
    </div>
    <div class="form-row">
      <label class="form-label">币种</label>
      <select id="trade-ccy">
        <option value="HKD">HKD</option>
        <option value="USD">USD</option>
        <option value="JPY">JPY</option>
      </select>
    </div>
    <div class="form-row">
      <label class="form-label">备注</label>
      <input type="text" id="trade-note" placeholder="可选">
    </div>
    <div id="order-hint" style="display:none;font-size:12px;color:#1a7a4a;padding:6px 16px;background:#edf7f1;margin:0"></div>
    <div class="form-row" id="row-remaining" style="display:none">
      <label class="form-label">上次剩余股数</label>
      <input type="number" id="trade-prev-remaining" placeholder="通知单上次剩余" oninput="calcRemaining()">
    </div>
    <div class="form-row" id="row-deduction" style="display:none">
      <label class="form-label">本次扣减股数</label>
      <input type="number" id="trade-deduction" placeholder="通知单本次扣减" oninput="calcRemaining()">
    </div>
    <div class="form-row" id="row-calc-remaining" style="display:none">
      <label class="form-label">剩余未接股数</label>
      <input type="number" id="trade-remaining" placeholder="自动计算" style="background:#f5f5f5">
    </div>
  </div>

  <button class="btn-primary" id="btn-trade-submit" onclick="submitTrade()">✓ 确认录入交易</button>
  <div class="note">接股按批次计价；买入按FIFO计价</div>
</div>

<!-- ── Tab 3: 敲出 ── -->
<div class="tab-panel" id="tab-knockout">
  <button class="btn-secondary" onclick="loadPrices()">⬇ 先读取当前数据</button>
  <div class="note" style="padding:14px 16px;text-align:left">选择已敲出的订单，状态将更新为「敲出」</div>

  <div class="section">
    <div class="section-title">存续中订单</div>
    <div id="active-products-list"></div>
  </div>

  <div class="section" id="ko-confirm-section" style="display:none">
    <div class="section-title">确认敲出</div>
    <div class="form-row">
      <label class="form-label">订单</label>
      <span id="ko-product-name" style="font-weight:600;color:#1a2a4a"></span>
    </div>
    <div class="form-row">
      <label class="form-label">敲出日期</label>
      <input type="date" id="ko-date">
    </div>
  </div>

  <button class="btn-primary btn-danger" id="btn-ko" onclick="submitKnockout()" style="display:none">✓ 确认敲出</button>
</div>

<script>
const OWNER = 'enjoyrising-web';
const REPO  = 'options-dashboard';
const FILE  = 'data/products.json';
const TXN_FILE = 'data/transactions.json';

let productData = null;
let txnData = [];
let fileSHA = '';
let txnSHA = '';
let selectedKOProduct = null;

const TICKERS = {
  hk: [
    {name:'腾讯',    ticker:'700.HK'},
    {name:'阿里巴巴', ticker:'9988.HK'},
    {name:'协鑫科技', ticker:'3800.HK'},
    {name:'美团',    ticker:'3690.HK'},
    {name:'地平线',  ticker:'9660.HK'},
    {name:'中芯国际', ticker:'981.HK'},
    {name:'零跑',    ticker:'9863.HK'},
    {name:'网易',    ticker:'9999.HK'},
    {name:'吉利汽车', ticker:'175.HK'},
  ],
  us: [
    {name:'苹果',   ticker:'AAPL'},
    {name:'谷歌-C', ticker:'GOOG'},
    {name:'谷歌-A', ticker:'GOOGL'},
    {name:'台积电', ticker:'TSM'},
    {name:'AMD',   ticker:'AMD'},
    {name:'英特尔', ticker:'INTEL'},
    {name:'拼多多', ticker:'PDD'},
    {name:'PLTR',  ticker:'PLTR'},
    {name:'美光',  ticker:'MU'},
  ],
  jp: [
    {name:'软银',  ticker:'9984.T'},
    {name:'村田',  ticker:'6981.T'},
    {name:'TDK',  ticker:'6762.T'},
  ],
};

function getToken(){ return localStorage.getItem('gh_token')||''; }
function saveToken(){
  const t=document.getElementById('token-input').value.trim();
  if(t){localStorage.setItem('gh_token',t);showStatus('Token 已保存','ok');}
}
function showStatus(msg,type='ok'){
  const bar=document.getElementById('status-bar');
  bar.textContent=msg; bar.className='status-bar show '+type;
  if(type==='ok') setTimeout(()=>bar.classList.remove('show'),3000);
}
function switchTab(name,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

// ── Build price rows ──────────────────────────────────────────
function buildRows(){
  ['hk','us','jp'].forEach(grp=>{
    document.getElementById('rows-'+grp).innerHTML=TICKERS[grp].map(t=>`
      <div class="price-row">
        <div class="price-label">
          <div class="price-name">${t.name}</div>
          <div class="price-ticker">${t.ticker}</div>
        </div>
        <input class="price-input" type="number" step="any"
          data-ticker="${t.ticker}" placeholder="—"
          oninput="this.classList.add('changed')">
      </div>`).join('');
  });
}

// ── Load data from GitHub ─────────────────────────────────────
async function loadPrices(){
  const token=getToken();
  if(!token){showStatus('请先输入 GitHub Token','err');return;}
  showStatus('读取中...','loading');
  try{
    const headers={'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'};
    const [pRes, tRes] = await Promise.all([
      fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`,{headers}),
      fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${TXN_FILE}`,{headers})
    ]);
    if(!pRes.ok) throw new Error('HTTP '+pRes.status);
    const pJson=await pRes.json();
    fileSHA=pJson.sha;
    const raw=atob(pJson.content.replace(/\n/g,''));
    const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
    productData=JSON.parse(new TextDecoder().decode(bytes));

    if(tRes.ok){
      const tJson=await tRes.json();
      txnSHA=tJson.sha;
      const tRaw=atob(tJson.content.replace(/\n/g,''));
      const tBytes=Uint8Array.from(tRaw,c=>c.charCodeAt(0));
      txnData=JSON.parse(new TextDecoder().decode(tBytes));
    }

    // Fill prices
    const priceMap={};
    productData.products.forEach(p=>{if(p.ticker&&p.close)priceMap[p.ticker]=p.close;});
    document.querySelectorAll('.price-input').forEach(inp=>{
      const t=inp.dataset.ticker;
      if(priceMap[t]){inp.value=priceMap[t];inp.classList.remove('changed');}
    });

    // Fill ticker select
    const tickers=[...new Set(productData.products.map(p=>p.ticker).filter(Boolean))].sort();
    const sel=document.getElementById('trade-ticker');
    sel.innerHTML='<option value="">-- 选择标的 --</option>'+
      tickers.map(t=>{
        const p=productData.products.find(pp=>pp.ticker===t);
        const name=p?p.underlying:'';
        return `<option value="${t}">${name} (${t})</option>`;
      }).join('');
    sel.onchange=()=>updateOrderSelect();

    // Fill CCY based on ticker
    document.getElementById('trade-ticker').onchange=function(){
      updateOrderSelect();
      const p=productData.products.find(pp=>pp.ticker===this.value);
      if(p) document.getElementById('trade-ccy').value=p.ccy||'HKD';
    };

    // Fill active products list for knockout
    renderActiveProducts();

    const updated=productData.priceUpdatedAt||productData.updatedAt||'—';
    document.getElementById('last-sync').textContent='上次更新：'+updated;
    showStatus('数据加载成功','ok');
  }catch(e){
    showStatus('加载失败：'+e.message,'err');
  }
}

function updateOrderSelect(){
  const ticker=document.getElementById('trade-ticker').value;
  const sel=document.getElementById('trade-order');
  if(!productData||!ticker){sel.innerHTML='<option>--</option>';return;}
  const prods=productData.products.filter(p=>p.ticker===ticker&&p.status==='存续中');
  sel.innerHTML='<option value="">-- 选择订单（可选）--</option>'+
    prods.map(p=>`<option value="${p.product}" data-knockin="${p.knockin||''}" data-uns="${p.uns||''}">${p.product}${p.knockin?' 敲入@'+p.knockin:''}</option>`).join('');
  sel.onchange=onOrderSelect;
}

function onOrderSelect(){
  const sel=document.getElementById('trade-order');
  const opt=sel.options[sel.selectedIndex];
  // Show strike price hint
  const knockin=opt.dataset.knockin;
  const uns=opt.dataset.uns;
  const hint=document.getElementById('order-hint');
  if(knockin||uns){
    hint.textContent=(knockin?'敲入价：'+knockin+'　':'')+(uns?'当前未接股数：'+Number(uns).toLocaleString():'');
    hint.style.display='block';
    // Pre-fill uns as prev_remaining
    if(uns) document.getElementById('trade-prev-remaining').value=uns;
  } else {
    hint.style.display='none';
  }
}

function calcRemaining(){
  const prev=parseFloat(document.getElementById('trade-prev-remaining').value)||0;
  const ded=parseFloat(document.getElementById('trade-deduction').value)||0;
  if(prev>0){
    document.getElementById('trade-remaining').value=prev-ded;
  }
}

function onTradeTypeChange(){
  const typ=document.getElementById('trade-type').value;
  document.getElementById('row-order').style.display=
    ['接股','行权卖出'].includes(typ)?'flex':'none';
  const isJG=typ==='接股';
  document.getElementById('row-remaining').style.display=isJG?'flex':'none';
  document.getElementById('row-deduction').style.display=isJG?'flex':'none';
  document.getElementById('row-calc-remaining').style.display=isJG?'flex':'none';
  if(!isJG) document.getElementById('order-hint').style.display='none';
}

// ── Submit trade ──────────────────────────────────────────────
async function submitTrade(){
  if(!productData){showStatus('请先读取当前数据','err');return;}
  const submitBtn=document.getElementById('btn-trade-submit');
  submitBtn.disabled=true; submitBtn.textContent='录入中...';
  showStatus('处理中...','loading');
  const typ    = document.getElementById('trade-type').value;
  const ticker = document.getElementById('trade-ticker').value;
  const order  = document.getElementById('trade-order').value;
  const date   = document.getElementById('trade-date').value;
  const qty    = parseFloat(document.getElementById('trade-qty').value);
  const price  = parseFloat(document.getElementById('trade-price').value);
  const ccy    = document.getElementById('trade-ccy').value;
  const note   = document.getElementById('trade-note').value;

  if(!ticker||!date||!qty||!price){
    showStatus('请填写标的、日期、数量、单价','err');return;
  }

  showStatus('处理中...','loading');

  // 1. Add to transactions
  const newTx = {
    ticker, underlying: productData.products.find(p=>p.ticker===ticker)?.underlying||'',
    date, type:typ, ccy, price, qty: ['卖出','行权卖出'].includes(typ)?-qty:qty,
    amount: parseFloat(document.getElementById('trade-amount').value)||null, lotType: ['接股'].includes(typ)?'批次计价':'FIFO',
    note: order?(order+' '+note).trim():note,
    remaining: parseInt(document.getElementById('trade-remaining').value)||null
  };
  txnData.push(newTx);

  // 2. Update inventory - normalize ticker (remove dots, use consistent key)
  let inv = productData.inventory || {};
  // Normalize: '700.HK' -> '700HK', '3800.HK' -> '3800HK', '9984.T' -> '9984JT' etc.
  const normTicker = ticker.replace('.HK','HK').replace('.T','JT').replace('.','').toUpperCase();
  // Find existing key (case-insensitive match)
  const existingKey = Object.keys(inv).find(k=>k.toUpperCase()===normTicker) || normTicker;
  if(!inv[existingKey]) inv[existingKey]={qty:0,lots:[],realized:0.0,ccy};

  if(['接股','买入'].includes(typ)){
    inv[existingKey].lots.push({
      price, qty, type:typ==='接股'?'batch':'fifo',
      date, txType:typ, ccy
    });
    inv[existingKey].qty += qty;
  } else if(['卖出','行权卖出'].includes(typ)){
    // FIFO consume
    let remaining=qty;
    while(remaining>0&&inv[existingKey].lots.length>0){
      const lot=inv[existingKey].lots[0];
      const consume=Math.min(lot.qty,remaining);
      if(price&&lot.price) inv[existingKey].realized+=(price-lot.price)*consume;
      lot.qty-=consume;
      inv[existingKey].qty-=consume;
      remaining-=consume;
      if(lot.qty===0) inv[existingKey].lots.shift();
    }
  }
  productData.inventory=inv;

  // 3. Update product inventory display
  const underlying=productData.products.find(p=>p.ticker===ticker)?.underlying;
  if(underlying){
    let shown=false;
    productData.products.forEach(p=>{
      if(p.underlying===underlying){
        if(!shown&&p.status==='存续中'&&inv[existingKey]?.qty>0){
          p.inventory=inv[existingKey].qty; shown=true;
        } else if(p.status!=='存续中'){ p.inventory=null; }
      }
    });
  }

  // 4. Update uns on matching order
  const remInput = document.getElementById('trade-remaining').value.trim();
  const remainingVal = remInput !== '' ? parseInt(remInput) : null;
  if(typ==='接股' && order && remainingVal !== null && !isNaN(remainingVal)){
    productData.products.forEach(p=>{
      if(p.product===order){
        p.uns = remainingVal;
        if(remainingVal === 0) p.status = '敲出';
      }
    });
  }

  const now=new Date();
  const hkt=new Date(now.getTime()+8*3600000);
  productData.updatedAt=hkt.toISOString().slice(0,10);

  await pushBothFiles('录入交易: '+typ+' '+ticker+' '+qty+'股@'+price);
  submitBtn.disabled=false; submitBtn.textContent='✓ 确认录入交易';
}

// ── Knockout ──────────────────────────────────────────────────
function renderActiveProducts(){
  if(!productData) return;
  const active=productData.products.filter(p=>p.status==='存续中');
  document.getElementById('active-products-list').innerHTML=
    active.map(p=>`
      <div class="prod-item" onclick="selectKO('${p.product}')">
        <div>
          <div class="prod-name">${p.product} <span class="badge-tag">${p.underlying}</span></div>
          <div class="prod-meta">${p.type} · ${p.obs||''}</div>
        </div>
        <span class="prod-status s-active">存续中</span>
      </div>`).join('')||'<div class="note">无存续订单</div>';
}

function selectKO(product){
  selectedKOProduct=product;
  document.getElementById('ko-product-name').textContent=product;
  const today=new Date(Date.now()+8*3600000*-0).toISOString().slice(0,10);
  document.getElementById('ko-date').value=today;
  document.getElementById('ko-confirm-section').style.display='block';
  document.getElementById('btn-ko').style.display='block';
  window.scrollTo(0,document.body.scrollHeight);
}

async function submitKnockout(){
  if(!productData||!selectedKOProduct){showStatus('请先选择订单','err');return;}
  const koDate=document.getElementById('ko-date').value;
  if(!koDate){showStatus('请填写敲出日期','err');return;}

  showStatus('处理中...','loading');

  productData.products.forEach(p=>{
    if(p.product===selectedKOProduct){
      p.status='敲出';
      p.uns=0;
      p.koDate=koDate;
    }
  });

  const now=new Date(Date.now()+8*3600000);
  productData.updatedAt=now.toISOString().slice(0,10);

  await pushBothFiles('敲出: '+selectedKOProduct+' '+koDate);
  selectedKOProduct=null;
  document.getElementById('ko-confirm-section').style.display='none';
  document.getElementById('btn-ko').style.display='none';
  renderActiveProducts();
}

// ── Push prices ───────────────────────────────────────────────
async function pushPrices(){
  const token=getToken();
  if(!productData){showStatus('请先读取当前数据','err');return;}
  const btn=document.getElementById('btn-price-update');
  btn.disabled=true; btn.textContent='更新中...';
  showStatus('写入中...','loading');

  const changes={};
  document.querySelectorAll('.price-input.changed').forEach(inp=>{
    const v=parseFloat(inp.value);
    if(!isNaN(v)) changes[inp.dataset.ticker]=v;
  });
  if(!Object.keys(changes).length){
    showStatus('没有修改任何价格','err');
    btn.disabled=false;btn.textContent='⬆ 更新收盘价到看板';return;
  }
  productData.products.forEach(p=>{
    if(p.ticker&&changes[p.ticker]!==undefined) p.close=changes[p.ticker];
  });
  const now=new Date(Date.now()+8*3600000);
  productData.priceUpdatedAt=now.toISOString().slice(0,16).replace('T',' ')+' HKT';
  productData.updatedAt=now.toISOString().slice(0,10);

  try{
    await pushFile(FILE,productData,fileSHA,'收盘价更新 '+productData.priceUpdatedAt);
    document.querySelectorAll('.price-input.changed').forEach(i=>i.classList.remove('changed'));
    document.getElementById('last-sync').textContent='上次更新：'+productData.priceUpdatedAt;
    showStatus('✓ 已更新 '+Object.keys(changes).length+' 个标的','ok');
    document.getElementById('last-updated').textContent='更新时间：'+productData.priceUpdatedAt;
  }catch(e){showStatus('写入失败：'+e.message,'err');}
  btn.disabled=false;btn.textContent='⬆ 更新收盘价到看板';
}

// ── Push both files ───────────────────────────────────────────
async function pushBothFiles(msg){
  const token=getToken();
  if(!token){showStatus('请先输入 Token','err');return;}
  try{
    await pushFile(FILE,productData,fileSHA,msg);
    if(txnData.length&&txnSHA){
      await pushFile(TXN_FILE,txnData,txnSHA,msg);
    }
    showStatus('✓ '+msg+' 已保存','ok');
    // reload SHA
    const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`,
      {headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}});
    if(r.ok){const j=await r.json();fileSHA=j.sha;}
  }catch(e){showStatus('写入失败：'+e.message,'err');}
}

async function pushFile(path,data,sha,msg){
  const token=getToken();
  const jsonStr=JSON.stringify(data,null,2);
  const bytes=new TextEncoder().encode(jsonStr);
  const binStr=Array.from(bytes,b=>String.fromCharCode(b)).join('');
  const content=btoa(binStr);
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{
    method:'PUT',
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({message:msg,content,sha})
  });
  if(!r.ok){const e=await r.json();throw new Error(e.message||'HTTP '+r.status);}
  const result=await r.json();
  if(path===FILE) fileSHA=result.content.sha;
  if(path===TXN_FILE) txnSHA=result.content.sha;
}

buildRows();

if(savedToken) document.getElementById('token-input').value=savedToken.slice(0,8)+'...';
// Set today's date
const today=new Date(Date.now()).toISOString().slice(0,10);
document.getElementById('trade-date').value=today;
